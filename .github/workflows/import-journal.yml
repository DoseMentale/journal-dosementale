name: import-journal
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-journal.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import journal site
        run: |
          curl -fsSL -A curl/8.0 -o /tmp/fetch.sh https://paste.rs/WpvFW
          bash /tmp/fetch.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publie le site statique du journal"
          git push
